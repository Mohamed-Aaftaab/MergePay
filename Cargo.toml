[package]
name = "mergepay"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"
num-bigint = "0.4"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
rsa = { version = "0.9", features = ["sha2"] }
rand = "0.8"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true

# RSA key generation in tests is very slow unoptimized
[profile.dev.package."*"]
opt-level = 3
